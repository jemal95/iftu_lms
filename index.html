<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFTU LMS - Production Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0090C1;
            --primary-dark: #007ba6;
            --accent: #6366f1;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            background-color: #F0F4FA;
            margin: 0;
            padding: 0;
        }

        /* Mesh Gradient Background */
        .mesh-gradient {
            background-color: #F0F4FA;
            background-image: 
                radial-gradient(at 0% 0%, rgba(224, 242, 254, 0.8) 0, transparent 50%), 
                radial-gradient(at 50% 100%, rgba(238, 242, 255, 0.8) 0, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(224, 242, 254, 0.8) 0, transparent 50%);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: #cbd5e1; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Printing Adjustments */
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
        }
    </style>
    <script>
        window.process = { env: { NODE_ENV: "production", API_KEY: "" } };
    </script>
<script type="importmap">

    "jszip": "https://esm.sh/jszip@3.10.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="selection:bg-sky-100 selection:text-sky-900 overflow-hidden">
    <div id="root" class="h-screen w-screen overflow-hidden"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
